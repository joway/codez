[package]
name = "codez"
version = "0.1.1"
edition = "2021"
description = "A fast, native git diff viewer for macOS"

[dependencies]
# GPU-rendered immediate-mode GUI. wgpu backend -> Metal on macOS (Zed-style rendering).
eframe = { version = "0.29", default-features = false, features = ["wgpu"] }
egui = "0.29"
# libgit2 bindings (vendored build via cc, no system cmake needed).
# default-features off drops the ssh/https transports (and their openssl-sys
# dependency) — we only do local repo ops; `git push` shells out to system git.
# This also lets the app cross-compile to a universal (arm64 + x86_64) binary.
git2 = { version = "0.19", default-features = false }
# Native file/folder open dialogs.
rfd = "0.15"
# Memory-map large files instead of reading them into the heap.
memmap2 = "0.9"
# SIMD-accelerated newline scanning for the line index.
memchr = "2"
# Rope buffer for efficient large-file text editing.
ropey = "1"
# Move files to the system trash (reversible delete).
trash = "5"
# Native macOS menu bar (NSMenu).
muda = "0.15"
# Headless terminal: PTY spawn + VT/ANSI parsing + grid state (no UI of its own).
# Pinned to 0.25.x to match the API the terminal pane is written against.
alacritty_terminal = "0.25.1"
# Decode the embedded PNG app icon for native windows launched via `cargo run`.
png = "0.17"
# Format local reset times in the Agent usage panel.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Set the native window/titlebar appearance to dark.
objc2-foundation = "0.2"
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSResponder",
    "NSAppearance",
] }

[profile.release]
opt-level = 3
lto = "thin"
